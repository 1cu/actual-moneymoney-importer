# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: 'en-GB'
enable_free_tier: true
early_access: true
reviews:
    profile: assertive
    request_changes_workflow: true
    high_level_summary: true
    poem: false
    review_status: false
    sequence_diagrams: false
    collapse_walkthrough: false
    finishing_touches:
        docstrings:
            enabled: false
        unit_tests:
            enabled: false
    auto_review:
        enabled: true
        ignore_title_keywords:
            - 'WIP'
            - 'DO NOT MERGE'
            - 'SWEEP'
        drafts: false
        base_branches:
            - main
            - '^release/.*$'
            - develop
    path_instructions:
        - path: '*'
          instructions: |
              # Basic formatting
              All character sets need to be in UTF-8.
              Lines need to end with LF (line feed).
              Spaces for indentation instead of tabs.
              A newline must be inserted at the end of the file.
              Trim all trailing whitespaces.
              Maximum line length must be 120 characters.
              Remove any console.log statements.
              Handle leftover TODOs in the code.

              # Complexity prevention
              Follow the YAGNI Principle: 'You aren't gonna need it' - don't add functionality until necessary.
              Keep code simple and focused on essential functionality.
              Avoid over-engineering and premature optimization.
              Delete over abstract - remove complexity instead of refactoring.
              Inline simple functionality instead of creating wrappers.
              Question every abstraction - does it solve a real problem?

              # macOS-only project
              This is a macOS-only project. Use native macOS tools and syntax.

              # Testing
              Write focused, readable tests that cover essential functionality.
              Avoid over-testing edge cases and micro-optimizations.
              Keep tests simple with minimal fixtures.

              # Code quality
              Follow existing Prettier and ESLint configurations.
              Keep functions simple and focused on single responsibilities.
              Prefer explicit over implicit, but don't over-abstract.
              Use meaningful names and clear structure.
chat:
    auto_reply: true
knowledge_base:
    code_guidelines:
        enabled: true
        filePatterns:
            - '**/AGENTS.md'
            - 'CONTRIBUTING.md'
