# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: 'en-GB'
enable_free_tier: true
early_access: true
reviews:
    profile: assertive
    request_changes_workflow: true
    high_level_summary: true
    poem: false
    review_status: false
    sequence_diagrams: false
    collapse_walkthrough: false
    finishing_touches:
        docstrings:
            enabled: false
        unit_tests:
            enabled: false
    auto_review:
        enabled: true
        ignore_title_keywords:
            - 'WIP'
            - 'DO NOT MERGE'
            - 'SWEEP'
        drafts: false
        base_branches:
            - main
            - '^release/.*$'
            - develop
    path_instructions:
        - path: '*'
          instructions: |
              # Basic formatting
              All character sets need to be in UTF-8.
              Lines need to end with LF (line feed).
              Use spaces (2) for indentation; no tabs.
              A newline must be inserted at the end of the file.
              Trim all trailing whitespaces.
              Respect the repo's Prettier printWidth; do not hand-enforce line length outside tooling.
              Avoid console.log in src/**; tests may log behind a debug flag.
              No TODO/FIXME/XXX without an issue link; otherwise resolve before merge.

              # Complexity prevention
              Follow the YAGNI Principle: 'You aren't gonna need it' - don't add functionality until necessary.
              Keep code simple and focused on essential functionality.
              Avoid over-engineering and premature optimization.
              Prefer deletion over unnecessary abstraction; remove unused layers rather than refactoring them.
              Do not delete domain concepts that provide safety or clarity.
              Inline simple functionality instead of creating wrappers.
              Question every abstraction - does it solve a real problem?

              # macOS-only project
              Target platform is macOS (MoneyMoney). Use macOS paths in docs, but keep CI and project scripts POSIX-portable; avoid macOS-only shellisms.

              # Testing
              Write focused, readable tests that cover essential functionality.
              Avoid over-testing trivia, but retain edge-case tests for critical flows (timeouts, duplicates, rounding/locales).
              Keep tests simple with minimal fixtures; prefer E2E smoke tests for core import/sync paths.

              # Code quality
              Follow existing Prettier and ESLint configurations.
              Keep functions simple and focused on single responsibilities.
              Prefer explicit over implicit, but don't over-abstract.
              Use meaningful names and clear structure.
              Align with ESLint complexity/max-lines rules to avoid guideline drift.
              Prefer explicit types at module boundaries; allow inference internally.
chat:
    auto_reply: true
knowledge_base:
    code_guidelines:
        enabled: true
        filePatterns:
            - '**/AGENTS.md'
            - 'CONTRIBUTING.md'
