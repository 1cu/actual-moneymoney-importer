version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      commit-message:
          prefix: fix
          prefix-development: chore
          include: scope
      groups:
          npm-production:
              dependency-type: production
              patterns:
                  - '*'
          npm-development:
              dependency-type: development
              patterns:
                  - '*'
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      groups:
          actions:
              patterns:
                  - '*'
