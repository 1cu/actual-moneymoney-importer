# Payee transformation
[payeeTransformation]
enabled = false
# backend = "openai"  # Optional: "openai" (default) or "apple-intelligence"
#                     # "apple-intelligence" provides on-device processing
#                     # via Apple's Foundation Models. Requires macOS 26+ (Tahoe),
#                     # Apple Silicon, and Apple Intelligence enabled in System Settings.
#                     # No API key needed; all data stays local.
# openAiApiKey = "${MMI_OPENAI_KEY}"  # Required only with backend = "openai"
#                                    # Use an env var (${MMI_OPENAI_KEY})
#                                    # or a literal key string
# openAiModel = "gpt-4o-mini"  # Optional: OpenAI model (default: gpt-5.4-nano)
# temperature = 0  # Optional: Temperature (0–2 inclusive, default: 0)
# onTransformError = "warn"  # Optional: "warn" (default) or "fail"
# prompt = "<custom prompt>"  # Optional: Override the default payee transformation instructions

# payeeMatchThreshold = 0.7  # Optional: Dice bigram score threshold (0.0–1.0)
#                            # for snapping payees to existing budget payees.
#                            # 1.0 = exact match only (after normalization),
#                            # 0.0 = match anything. Lower values catch more
#                            # partial-name matches but may produce false snaps
#                            # on short generic names (default: 0.7).

# maxExistingPayeesInPrompt = 100  # Optional: How many existing budget payees
#                                  # to include in the AI prompt as reference.
#                                  # Higher = more context but larger prompts.
#                                  # Set to 0 to omit existing payees (default: 100).

# Import settings
[import]
importUncheckedTransactions = true
synchronizeClearedStatus = true
categorySync = "off" # off|new|all (off = don't apply category mappings, new = new imports only, all = also update existing)
importComments = false
commentPrefix = "MoneyMoney Comment: "

[import.transfers]
enabled = false
categoryRefs = ["Umbuchungen > Echte Umbuchungen"]
matchWindowDays = 0

# Ignore patterns (optional)
# [import.ignorePatterns]
# commentPatterns = ["[actual-ignore]"]
# payeePatterns = []
# purposePatterns = []

# Actual servers, you can add multiple servers
[[actualServers]]
serverUrl = "http://localhost:5006"
serverPassword = "<password>"

# Budgets for the server, you can add multiple budgets
[[actualServers.budgets]]
syncId = "<syncId>" # Get this value from the Actual advanced settings
# earliestImportDate = "2024-01-01" # Optional, only import transactions from this date

# Intentionally ignored MoneyMoney categories (optional)
# Place this at the budget level (before any [actualServers.budgets.*] subsections).
# Categories listed here are excluded from the "unresolved" count in
# the mapping report. Use this for transfer categories or categories
# that should never receive category assignments.
# ignoredMoneyMoneyCategoryRefs = ["path:Umbuchungen > Echte Umbuchungen"]

# E2E encryption for the budget, if enabled
[actualServers.budgets.e2eEncryption]
enabled = false
password = ""

# Account map for the budget
[actualServers.budgets.accountMapping]
# The key is the account name, account number (IBAN), or UUID of a MoneyMoney account.
# Use "actual-mmi accounts list --format toml" to see available accounts with their UUIDs.
# The value is the account name or the account id (from the url) of the Actual account
"<monMonAcc>" = "<actualAcc>"

# Category map for the budget (optional)
# Tool-managed block: running actual-mmi categories map --write-config
# rewrites this section with annotated comments for readability.
# Keys use human-readable "path:" refs by default: "path:Expenses > Food"
# Fall back to "uuid:<uuid>" or "id:<id>" only for ambiguous categories.
[actualServers.budgets.categoryMapping]
"path:<monMonCategoryPath>" = "path:<actualCategoryPath>"

